name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pandas numpy pydantic

      # Linting and testing are intentionally SEPARATE steps (per criteria).
      - name: Lint with flake8
        run: flake8 src tests dags

      - name: Run unit tests with pytest
        run: pytest -q